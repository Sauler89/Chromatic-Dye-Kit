name: Add README screenshot

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/add-readme-screenshot.yml'

permissions:
  contents: write

jobs:
  publish-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore optimized in-game screenshot
        shell: bash
        run: |
          mkdir -p images
          cat tools/screenshot.part0 tools/screenshot.part1 tools/screenshot.part2 tools/screenshot.part3 | base64 --decode > images/chromatic-dye-kit-description.webp
          echo '771563ed2a14501c6df90b1c59cdcefa51548065d770f69747e080023e191608  images/chromatic-dye-kit-description.webp' | sha256sum --check

      - name: Add screenshot prominently to README
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          marker = '## Features\n'
          block = '''## In-game screenshot

<p align="center">
  <img src="images/chromatic-dye-kit-description.webp" alt="Chromatic Dye Kit item description in game" width="550">
</p>

'''
          if 'images/chromatic-dye-kit-description.webp' not in s:
              if marker not in s:
                  raise SystemExit('README insertion marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit screenshot and clean temporary helpers
        shell: bash
        run: |
          rm -f tools/screenshot.part0 tools/screenshot.part1 tools/screenshot.part2 tools/screenshot.part3
          rm -f .github/workflows/add-readme-screenshot.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add in-game screenshot to README'
          git push
