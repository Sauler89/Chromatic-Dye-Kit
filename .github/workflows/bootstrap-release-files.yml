name: Bootstrap release files

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/scdye.d.gz.b64'
      - '.github/workflows/bootstrap-release-files.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore tested dialogue source
        shell: bash
        run: |
          base64 --decode tools/scdye.d.gz.b64 | gzip --decompress --stdout > Chromatic-Dye-Kit/dialogs/scdye.d
          echo 'a3533f5051429619cabcbc5ab0228dfe8c3459186377ce6e4e3a8965dfabebbb  Chromatic-Dye-Kit/dialogs/scdye.d' | sha256sum --check

      - name: Add WeiDU 251.00 Windows installer
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            'https://github.com/WeiDUorg/weidu/releases/download/v251.00/WeiDU-Windows-251.zip' \
            --output /tmp/weidu-windows.zip
          mkdir -p /tmp/weidu-windows
          unzip -q /tmp/weidu-windows.zip -d /tmp/weidu-windows
          WEIDU_EXE="$(find /tmp/weidu-windows -type f -iname 'weidu.exe' -print -quit)"
          test -n "$WEIDU_EXE"
          cp "$WEIDU_EXE" setup-Chromatic-Dye-Kit.exe
          chmod 0644 setup-Chromatic-Dye-Kit.exe
          test -s setup-Chromatic-Dye-Kit.exe

      - name: Commit release files and remove bootstrap helpers
        shell: bash
        run: |
          rm -f tools/scdye.d.gz.b64
          rm -f .github/workflows/bootstrap-release-files.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add dialogue source and WeiDU installer'
          git push

# Bootstrap helper: removed automatically after the generated files are committed.
