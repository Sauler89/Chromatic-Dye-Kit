name: Publish Chromatic Dye Kit 1.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-1.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chromatic-release /tmp/Chromatic-Dye-Kit-1.0.zip
          mkdir -p /tmp/chromatic-release
          cp README.md CHANGELOG.md LICENSE setup-Chromatic-Dye-Kit.exe /tmp/chromatic-release/
          cp -a Chromatic-Dye-Kit /tmp/chromatic-release/
          cd /tmp/chromatic-release
          zip -r -9 /tmp/Chromatic-Dye-Kit-1.0.zip .
          unzip -t /tmp/Chromatic-Dye-Kit-1.0.zip

      - name: Remove temporary publisher from main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-1.0.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove 1.0 release publishing helper'
          git push
          echo "CLEAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Write release notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## Chromatic Dye Kit 1.0

          First standalone release of **Chromatic Dye Kit**.

          ### Highlights
          - Supports **BG:EE, BG2:EE, EET, and IWD:EE**.
          - Adds a reusable dye kit that can recolor **metal/decorations, skin, leather/straps, armor/robe trim, and hair**.
          - Includes all **115 Enhanced Edition palette gradients** for each supported color range.
          - Includes **Restore Hair Base Color**, **Restore Skin Base Color**, and **Restore All Base Colors**.
          - Uses a standalone `SCDYE` / `SCD*` resource namespace.
          - Adds dedicated custom inventory/store artwork and a classic-style monochrome item-description illustration.
          - No **EEex** or **Infinity UI++** dependency.

          ### Store placement
          - **BG:EE:** Winthrop, Candlekeep Inn
          - **BG2:EE:** Ribald, Adventurer's Mart
          - **EET:** both Winthrop and Ribald
          - **IWD:EE:** Pomab, Easthaven

          The complete feature set was runtime-tested on **EET** before release.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release 1.0 already exists.' >&2
            exit 1
          fi
          gh release create 1.0 \
            /tmp/Chromatic-Dye-Kit-1.0.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CLEAN_SHA" \
            --title 'Chromatic Dye Kit 1.0' \
            --notes-file /tmp/release-notes.md

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view 1.0 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,assets,url
